version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: panini-postgres
    environment:
      POSTGRES_USER: panini_user
      POSTGRES_PASSWORD: panini_dev_password
      POSTGRES_DB: panini_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panini_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: panini-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: panini-api
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: panini_db
      DB_USER: panini_user
      DB_PASSWORD: panini_dev_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: dev-secret-key-change-in-production-1234567890
      CORS_ORIGIN: "http://localhost:5173,http://localhost:5174,http://192.168.0.21:5173"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    command: npm run dev

  frontend:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
    container_name: panini-frontend
    environment:
      VITE_API_URL: http://api:3000
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./frontend-web/src:/app/src
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
